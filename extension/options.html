<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Chrome AI Bridge: Impostazioni</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #0d0a07; color: #e8e2d8; margin: 0; padding: 2rem; }
      .card { max-width: 560px; margin: 0 auto; background: #17120d; border: 1px solid #2c241a; border-radius: 12px; padding: 1.5rem; }
      h1 { font-size: 1.2rem; color: #c9a962; margin: 0 0 .25rem; }
      p { color: #a89f90; font-size: .85rem; line-height: 1.5; }
      label { display: block; font-size: .8rem; color: #c9a962; margin: 1rem 0 .3rem; }
      input { width: 100%; box-sizing: border-box; background: #0d0a07; border: 1px solid #2c241a; color: #e8e2d8; border-radius: 8px; padding: .6rem .7rem; font-size: .9rem; }
      button { margin-top: 1.2rem; background: #c9a962; color: #0d0a07; border: 0; border-radius: 8px; padding: .6rem 1rem; font-weight: 600; cursor: pointer; }
      button.secondario { background: transparent; color: #c9a962; border: 1px solid #c9a962; margin-left: .5rem; }
      .stato { margin-top: 1rem; font-size: .85rem; }
      .ok { color: #4ade80; }
      .ko { color: #f87171; }
      code { background: #0d0a07; padding: .1rem .3rem; border-radius: 4px; font-size: .8rem; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Chrome AI Bridge</h1>
      <p>
        Incolla qui i dati mostrati dal ponte sul tuo computer
        (<code>node bridge.mjs --print-config</code>). Il ponte ascolta solo su
        <code>127.0.0.1</code> o sulla tua rete privata Tailscale: mai su internet.
      </p>

      <label for="bridgeUrl">URL del ponte</label>
      <input id="bridgeUrl" placeholder="ws://127.0.0.1:8765" />

      <label for="token">Token</label>
      <input id="token" placeholder="token segreto del ponte" />

      <div>
        <button id="salva">Salva e collega</button>
        <button id="stato" class="secondario">Controlla stato</button>
      </div>

      <div class="stato" id="esito"></div>
    </div>
    <script src="options.js"></script>
  </body>
</html>
